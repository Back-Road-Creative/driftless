# Resolved dependency set for svc-driftless — the pins CI installs against.
#
# This file is a CONSTRAINT list, not an install list. `.github/workflows/ci.yml`
# and `.github/workflows/pip-audit.yml` install with `--constraint`, so what gets
# installed is still decided by each caller's own arguments; this file only
# decides WHICH version of each resolved package lands. That keeps the Tests job,
# the audit, and the Docker image on one set of versions instead of three
# independent "latest at run time" resolutions — the audit used to scan a
# dependency set the shipped image never contained, because the image install
# line carried no constraint at all.
#
# The image reaches that same version set one step removed: it installs from
# `requirements-runtime.txt`, which is COMPILED under `-c requirements.lock` and
# so cannot name a version this file does not. That indirection buys hashes —
# see the note below — and `tests/test_image_dependency_parity.py` fails if the
# two files ever disagree about a version.
#
# The set is exactly what `pip install ".[dev]" uvicorn` resolves to: the union
# of what any of the three installs. The image installs the smaller half of it
# (the runtime closure — no test tooling in production), so the audit
# scans a superset of the shipped set and never a different one. uvicorn is
# pinned here although nothing declares it, because the image installs it and the
# audit must therefore see it; psycopg needs no such note: `[project.dependencies]`
# declares it, so `.` carries it into all three installs and the image's extra
# mention of it is belt-and-braces rather than the only thing putting it there.
#
# svc-driftless itself is deliberately absent: the project is installed from the
# checkout (`.`), and naming it here would constrain the thing being built.
#
# Regenerate after any dependency change (from a CLEAN venv, never from a
# working one — a stale venv pins whatever it happens to hold):
#
#   uv venv /tmp/lockenv --python python3.12
#   uv pip install --python /tmp/lockenv/bin/python ".[dev]" uvicorn
#   uv pip freeze --python /tmp/lockenv/bin/python | sort | grep -v '^svc-driftless'
#
# There are deliberately no `--hash` lines here, and adding them to THIS file breaks all
# three installs rather than hardening them. pip switches into hash-checking mode as soon
# as any requirement carries a hash, but it reads hashes off the requirement, never off a
# constraint — so with hashes added here every caller fails at "Hashes are required in
# --require-hashes mode, but they are missing from some requirements". That is why the
# hashes live in `requirements-runtime.txt` instead: a runtime-only requirements file the
# image installs with `-r --require-hashes`, followed by `pip install --no-deps .` for the
# checkout itself, because hash mode refuses a directory outright ("Can't verify hashes for
# these file:// requirements because they point to directories"). CI and the audit keep
# installing `.[dev]` under this constraint and stay hash-free by design: they build a
# throwaway venv on a runner, while the image is the artefact an operator runs.
#
