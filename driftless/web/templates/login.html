{% extends "base.html" %}
{% block title %}Sign in — driftless{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="card sev-red" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><!-- pairs with the cookie -->
  <p><label>Username<br><input name="username" autocomplete="username" required
    value="{{ username }}"{% if error %} autofocus{% endif %}></label></p><!-- a refusal keeps
    the typed name and puts focus where the retry starts -->
  <p><label>Password<br><input name="password" type="password" required></label></p>
  <p><button type="submit">Sign in</button> <small>No page requires it yet.</small></p>
</form>
{% endblock %}
