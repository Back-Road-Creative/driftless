{% extends "base.html" %}
{% block title %}Sign in — driftless{% endblock %}
{% block content %}
{% import "_alert.html" as alert %}
<h1>Sign in</h1>
{% if error or field_errors %}{{ alert.error(error, field_errors) }}{% endif %}
<form method="post" action="/login" class="narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><!-- pairs with the cookie -->
  <p><label for="username">Username</label><br><input name="username" id="username" autocomplete="username" required
    value="{{ username }}"{% if error %} autofocus{% endif %}></p><!-- a refusal keeps
    the typed name and puts focus where the retry starts -->
  <p><label for="password">Password</label><br><input name="password" id="password" type="password" required></p>
  <p><button type="submit" class="btn btn-primary">Sign in</button> <small>No page requires it yet.</small></p>
</form>
{% endblock %}
